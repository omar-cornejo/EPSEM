apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb-lora
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    basicAuth: false
    isDefault: true
    database: lora_db
    user: admin
    secureJsonData:
      password: adminpass
    jsonData:
      version: InfluxQL
      httpMode: "POST"
      timeInterval: "10s"