[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "mqttdb"
  username = "admin"
  password = "adminpass"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensor/#"]
  client_id = "telegraf_mqtt_consumer"
  qos = 0
  connection_timeout = "30s"
  data_format = "json"
  name_override = "mqtt_consumer"
  tagexclude = ["payload"]
